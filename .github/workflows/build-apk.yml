name: Build Android APK

on:
  push:
    branches: [main, gamesnap-angle-snap-demo]
  workflow_dispatch:

permissions:
  contents: read

# Serialize debug builds so a single cached signing identity is reused.
concurrency:
  group: gamesnap-experimental-debug-build
  cancel-in-progress: false

jobs:
  build:
    name: Build editor APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 35 using preinstalled SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Previous workflow cached ~/.android/debug.keystore but it never
      # existed (confirmed in logs), producing a new signature every run.
      # Generate the debug signing key BEFORE Gradle, then cache the exact file.
      - name: Restore persistent Quick Play signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gamesnap-debug-signing-quickplay-v1

      - name: Ensure a signing key exists before building
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep -m1 'SHA256:'
          test -s "$HOME/.android/debug.keystore"

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DartsPenSnap-Editor-APKs
          path: |
            app/build/outputs/apk/update/debug/*.apk
            app/build/outputs/apk/safecopy/debug/*.apk
            app/build/outputs/apk/velocitycopy/debug/*.apk
            app/build/outputs/apk/verifycopy/debug/*.apk
            app/build/outputs/apk/quickcopy/debug/*.apk
            app/build/outputs/apk/compactcopy/debug/*.apk
          if-no-files-found: error
          retention-days: 30
