name: Build Android APK

on:
  push:
    branches: [main, gamesnap-angle-snap-demo]
  workflow_dispatch:

permissions:
  contents: read

# Serialize debug builds so a single cached signing identity is reused.
concurrency:
  group: gamesnap-experimental-debug-build
  cancel-in-progress: false

jobs:
  build:
    name: Build editor APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 35 using preinstalled SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reuse experimental debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gamesnap-debug-signing-editor-v1

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DartsPenSnap-Editor-APKs
          path: |
            app/build/outputs/apk/update/debug/*.apk
            app/build/outputs/apk/safecopy/debug/*.apk
            app/build/outputs/apk/velocitycopy/debug/*.apk
            app/build/outputs/apk/verifycopy/debug/*.apk
            app/build/outputs/apk/quickcopy/debug/*.apk
          if-no-files-found: error
          retention-days: 30
